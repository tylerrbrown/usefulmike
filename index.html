<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Useful Mike?</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a1a;
    color: #d4d4d4;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overflow-x: hidden;
}

/* ── Header ── */
.header {
    text-align: center;
    margin-bottom: 1.2rem;
}
.header h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f59e0b, #ef4444, #10b981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.user-count {
    font-size: 0.85rem;
    color: #737373;
    margin-top: 0.3rem;
}
.user-count span {
    color: #a3a3a3;
    font-weight: 600;
}

/* ── Main battle area ── */
.battle {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
    width: 90%;
    max-width: 400px;
}

/* ── Arrow buttons ── */
.btn-arrow {
    width: 100%;
    height: 70px;
    border: none;
    border-radius: 16px;
    font-size: 2.2rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
}
.btn-arrow:active {
    transform: scale(0.90);
}
.btn-up {
    background: linear-gradient(135deg, #059669, #10b981, #34d399);
    color: #fff;
    box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
}
.btn-up:active {
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
}
.btn-down {
    background: linear-gradient(135deg, #dc2626, #ef4444, #f87171);
    color: #fff;
    box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
}
.btn-down:active {
    box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
}

/* ── Gauge container ── */
.gauge-wrap {
    width: 100%;
}

.gauge {
    width: 100%;
    height: 300px;
    background: #2a2a2a;
    border-radius: 20px;
    border: 2px solid #3a3a3a;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}
.gauge-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    border-radius: 0 0 18px 18px;
    transition: height 0.3s ease, background 0.3s ease;
}

/* ── Percentage display (centered inside gauge) ── */
.pct-display {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.pct-number {
    font-size: 5rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    transition: color 0.3s ease;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.pct-sign {
    font-size: 2rem;
    font-weight: 600;
    transition: color 0.3s ease;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.pct-label {
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #e5e5e5;
    margin-top: 0.4rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    font-weight: 600;
}


/* ── Connection status ── */
.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
    vertical-align: middle;
}
.status-dot.connected    { background: #10b981; box-shadow: 0 0 6px #10b981; }
.status-dot.disconnected { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
.status-dot.connecting   { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }

/* ── Flash effect on value change ── */
.gauge.flash-up   { animation: flashGreen 0.2s; }
.gauge.flash-down { animation: flashRed 0.2s; }
@keyframes flashGreen {
    0%, 100% { border-color: #3a3a3a; }
    50%      { border-color: #10b981; }
}
@keyframes flashRed {
    0%, 100% { border-color: #3a3a3a; }
    50%      { border-color: #ef4444; }
}

/* ── Empty state ── */
.feed-empty {
    text-align: center;
    color: #525252;
    font-size: 0.8rem;
    padding: 1rem;
}
</style>
</head>
<body>

<div class="header">
    <h1>USEFUL MIKE?</h1>
    <div class="user-count">
        <span class="status-dot connecting" id="statusDot"></span>
        <span id="userCount">0</span> watching
    </div>
</div>

<div class="battle">
    <button class="btn-arrow btn-up" id="btnUp">&#9650;</button>

    <div class="gauge-wrap">
        <div class="gauge" id="gauge">
            <div class="gauge-fill" id="gaugeFill"></div>
            <div class="pct-display">
                <div>
                    <span class="pct-number" id="pctNumber">--</span><span class="pct-sign" id="pctSign">%</span>
                </div>
                <div class="pct-label" id="pctLabel">useful</div>
            </div>
        </div>
    </div>

    <button class="btn-arrow btn-down" id="btnDown">&#9660;</button>
</div>


<script>
(function() {
    // ── Elements ──
    const btnUp      = document.getElementById('btnUp');
    const btnDown    = document.getElementById('btnDown');
    const gaugeFill  = document.getElementById('gaugeFill');
    const gaugeEl    = document.getElementById('gauge');
    const pctNumber  = document.getElementById('pctNumber');
    const pctSign    = document.getElementById('pctSign');
    const pctLabel   = document.getElementById('pctLabel');
    const userCount  = document.getElementById('userCount');
    const statusDot  = document.getElementById('statusDot');

    let currentValue = 50;
    let ws = null;
    let reconnectDelay = 500;

    // ── Color interpolation ──
    function valueColor(v) {
        // red(0) → orange(25) → yellow(50) → lime(75) → green(100)
        if (v <= 25) {
            const t = v / 25;
            return lerpColor([220, 38, 38], [245, 158, 11], t);
        } else if (v <= 50) {
            const t = (v - 25) / 25;
            return lerpColor([245, 158, 11], [234, 179, 8], t);
        } else if (v <= 75) {
            const t = (v - 50) / 25;
            return lerpColor([234, 179, 8], [132, 204, 22], t);
        } else {
            const t = (v - 75) / 25;
            return lerpColor([132, 204, 22], [16, 185, 129], t);
        }
    }
    function lerpColor(a, b, t) {
        return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
    }

    // ── Gauge update ──
    function setGauge(value) {
        currentValue = value;
        const pct = Math.max(0, Math.min(100, value));
        gaugeFill.style.height = pct + '%';
        const color = valueColor(pct);
        gaugeFill.style.background = `linear-gradient(to top, ${valueColor(Math.max(0, pct-20))}, ${color})`;
        pctNumber.textContent = pct;
        pctNumber.style.color = color;
        pctSign.style.color = color;

        if (pct === 0) {
            pctLabel.textContent = 'USELESS!';
            pctLabel.style.color = '#ef4444';
        } else {
            pctLabel.textContent = 'useful';
            pctLabel.style.color = '#e5e5e5';
        }
    }

    // ── Flash gauge border ──
    function flashGauge(direction) {
        gaugeEl.classList.remove('flash-up', 'flash-down');
        void gaugeEl.offsetWidth; // reflow
        gaugeEl.classList.add(direction === 'up' ? 'flash-up' : 'flash-down');
        setTimeout(() => gaugeEl.classList.remove('flash-up', 'flash-down'), 200);
    }

    // ── User count ──
    function setUsers(n) {
        userCount.textContent = n;
    }

    // ── WebSocket ──
    function connect() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(proto + '//' + location.host + '/ws');
        statusDot.className = 'status-dot connecting';

        ws.onopen = function() {
            statusDot.className = 'status-dot connected';
            reconnectDelay = 500;
        };

        ws.onclose = function() {
            statusDot.className = 'status-dot disconnected';
            ws = null;
            setTimeout(connect, reconnectDelay);
            reconnectDelay = Math.min(reconnectDelay * 2, 10000);
        };

        ws.onerror = function() {
            if (ws) ws.close();
        };

        ws.onmessage = function(e) {
            const msg = JSON.parse(e.data);

            if (msg.type === 'state') {
                setGauge(msg.value);
                setUsers(msg.users);
            }
            else if (msg.type === 'update') {
                setGauge(msg.value);
                setUsers(msg.users);
                flashGauge(msg.direction);
            }
            else if (msg.type === 'users') {
                setUsers(msg.users);
            }
        };
    }

    function send(action) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: action }));
        }
    }

    // ── Button events ──
    btnUp.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        send('up');
    });
    btnDown.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        send('down');
    });

    // Keyboard support
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
            e.preventDefault();
            send('up');
        }
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
            e.preventDefault();
            send('down');
        }
    });

    // ── Start ──
    setGauge(50);
    connect();
})();
</script>
</body>
</html>
